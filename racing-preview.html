<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D Racing - Preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #14161b; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, sans-serif; }
  h1 { color: #fff; font-size: 16px; margin: 8px 0; opacity: .85; }
  canvas { width: min(880px, 94vw); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.55); }
  p { color: rgba(255,255,255,.55); font-size: 12px; margin-top: 10px; }
  kbd { background: rgba(255,255,255,.12); border-radius: 4px; padding: 1px 6px; font-size: 11px; }
</style>
</head>
<body>
<h1>🏎️ 赛车竞速 · 视觉预览</h1>
<canvas id="game" width="1000" height="520"></canvas>
<p><kbd>↑</kbd>/<kbd>W</kbd> 油门 · <kbd>↓</kbd>/<kbd>S</kbd> 刹车 · <kbd>←</kbd>/<kbd>→</kbd> 转向 · <kbd>P</kbd> 暂停 · <kbd>R</kbd> 重开 · 跑完 3 圈</p>
<script>
"use strict";
/* ============ 与 RacingGame.tsx / racingLogic.ts 一致的常量与逻辑 ============ */
const SEG_LEN = 2, TRACK_SEGS = 1400, TRACK_METERS = TRACK_SEGS * SEG_LEN, TOTAL_LAPS = 3, TOTAL_METERS = TRACK_METERS * TOTAL_LAPS;
const ROAD_W = 18, CAM_HEIGHT = 5.6, FOCAL = 1.1, DRAW_DIST = 210, CAM_Z_OFF = 26, MIN_DEPTH = 2;
const MAX_SPEED = 62, ACCEL = 16, BRAKE = 30, DRAG = 3.4, CENTRI = 0.012;
const ROAD_CURB = 0.84, GRASS_DRAG = 12, CAR_LEN = 4.6, CAR_W = 1.9, AI_COUNT = 6;
const CW = 1000, CH = 520, HORIZON = CH * 0.42;

const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const lerp = (a, b, t) => a + (b - a) * t;
function accelerate(v, target, rate, dt) {
  if (target > v) return Math.min(v + rate * dt, target);
  if (target < v) return Math.max(v - rate * dt, target);
  return v;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const CURVE_PATTERN = [
  [0, 60, 0], [60, 190, 0.05], [190, 320, 0], [320, 430, -0.06], [430, 560, 0],
  [560, 700, 0.07], [700, 820, 0], [820, 930, -0.09], [930, 1080, 0], [1080, 1190, 0.055], [1190, 1400, 0],
];
function buildTrack(seed) {
  const segs = [];
  for (let i = 0; i < TRACK_SEGS; i++) {
    let curve = 0;
    for (const [s, e, c] of CURVE_PATTERN) { if (i >= s && i < e) { curve = c; break; } }
    segs.push({ index: i, curve });
  }
  return { segs, rand: mulberry32(seed) };
}
function hashRnd(index) { return mulberry32((index * 2654435761 + 1013904223) >>> 0); }
function roadsideAt(index) {
  const r = hashRnd(index);
  const roll = r();
  if (roll < 0.1) {
    const side = r() < 0.5 ? -1 : 1;
    const kind = roll < 0.035 ? "lamp" : "tree";
    return { kind, side, x: ROAD_W / 2 + 2.5 + r() * 4 };
  }
  return null;
}

function computeViews(track, playerSeg, playerX) {
  const views = [];
  const cameraX = playerX * (ROAD_W / 2);
  let relX = 0;
  for (let n = 0; n <= DRAW_DIST; n++) {
    const idx = (playerSeg + n) % TRACK_SEGS;
    const seg = track.segs[idx];
    if (n > 0) relX += seg.curve;
    const dz = n * SEG_LEN + CAM_Z_OFF;
    if (dz < MIN_DEPTH) continue;
    const scale = (FOCAL * CW) / dz;
    views.push({ seg, dz, scale, centerX: CW / 2 + (relX - cameraX) * scale, y: HORIZON + CAM_HEIGHT * scale });
  }
  return views;
}
function segIndexOf(z) { return Math.floor((((z % TRACK_METERS) + TRACK_METERS) % TRACK_METERS) / SEG_LEN) % TRACK_SEGS; }

function spawnAiCar(rand, z) {
  const lane = Math.floor(rand() * 3) - 1;
  return { x: lane * 0.55, z, speed: 0, cruise: 0.62 + rand() * 0.24, laneX: lane * 0.55, nextChangeZ: z + 220 + rand() * 500, colorIdx: Math.floor(rand() * CAR_COLORS.length) };
}
function spawnAiFleet(rand) {
  const ratios = [0.06, 0.18, 0.32, 0.5, 0.68, 0.84];
  const cars = [];
  for (let i = 0; i < AI_COUNT; i++) cars.push(spawnAiCar(rand, TRACK_METERS * ratios[i % ratios.length]));
  return cars;
}
function respawnFarAi(car, rand, playerZ) {
  const d = ringDist(car.z, playerZ, TRACK_METERS);
  if (d <= 700) return;
  const lane = Math.floor(rand() * 3) - 1;
  car.z = (playerZ + 450 + rand() * 450) % TRACK_METERS;
  car.laneX = lane * 0.55;
  car.x = lane * 0.55;
  car.speed = Math.max(car.speed, 12);
  car.nextChangeZ = car.z + 220 + rand() * 500;
}
function stepPlayer(p, input, curve, dt) {
  const target = input.up ? MAX_SPEED : input.down ? -MAX_SPEED * 0.3 : 0;
  const rate = input.up ? ACCEL : input.down ? BRAKE : DRAG;
  p.speed = accelerate(p.speed, target, rate, dt);
  p.speed = clamp(p.speed, -12, MAX_SPEED);
  const steer = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  const steerSpeed = clamp(0.35 + Math.abs(p.speed) * 0.011, 0.3, 1.1);
  p.x += steer * steerSpeed * dt * (p.speed >= 0 ? 1 : -1);
  p.steer = steer;
  p.x += curve * Math.max(0, p.speed) * CENTRI * 10 * dt;
  if (Math.abs(p.x) > ROAD_CURB) p.speed -= GRASS_DRAG * dt;
  p.x = clamp(p.x, -1.4, 1.4);
  if (p.crash > 0) p.crash -= dt;
}
function stepAi(car, rand, dt) {
  const target = car.cruise * MAX_SPEED * (0.9 + 0.2 * rand());
  car.speed = accelerate(car.speed, target, 6, dt);
  car.z = (car.z + car.speed * dt) % TRACK_METERS;
  if (car.z >= car.nextChangeZ) {
    const dir = rand() < 0.5 ? -1 : 1;
    const nextLane = clamp(Math.round(car.laneX / 0.55) + dir, -1, 1);
    car.laneX = nextLane * 0.55;
    car.nextChangeZ = car.z + 260 + rand() * 600;
    car.cruise = clamp(car.cruise + (rand() - 0.5) * 0.08, 0.58, 0.9);
  }
  car.x = lerp(car.x, car.laneX, Math.min(1, 0.9 * dt));
}
function ringDist(a, b, m) { let d = Math.abs(a - b); if (d > m / 2) d = m - d; return d; }
function detectCollision(p, ai) { return ringDist(p.z, ai.z, TRACK_METERS) < CAR_LEN + 2 && Math.abs(p.x - ai.x) * (ROAD_W / 2) < CAR_W + 0.7; }
const kmh = v => Math.round(v * 3.6);
const fmt = s => { const m = Math.floor(s / 60); return m + ":" + (s - m * 60).toFixed(1).padStart(4, "0"); };

/* ============ 游戏状态 ============ */
const CAR_COLORS = [
  ["#ff5a4e", "#2b2f3e", "#c33d33"],
  ["#4f8cff", "#22263a", "#3763c2"],
  ["#ffb020", "#33301f", "#c98a13"],
  ["#35d07f", "#1f3330", "#1f9a5b"],
  ["#c07bff", "#2b2438", "#8f4fd0"],
  ["#ff6fb5", "#33202e", "#c94a8c"],
];
function newGame() {
  const track = buildTrack(7);
  const ai = spawnAiFleet(track.rand);
  return {
    track, ai,
    player: { x: 0, z: 0, speed: 0, steer: 0, crash: 0 },
    lap: 1, prevZ: 0, lapStart: 0, bestLap: null,
    time: 0, lapFlash: 0, camShake: 0, over: false, recorded: false,
  };
}
let G = newGame();
let phase = "running";
const keys = new Set();

/* ============ Canvas 绘制 ============ */
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");

function rr(x, y, w, h, r) {
  const rad = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}
function trap(x1a, x1b, y1, x2a, x2b, y2) {
  ctx.beginPath();
  ctx.moveTo(x1a, y1);
  ctx.lineTo(x1b, y1);
  ctx.lineTo(x2b, y2);
  ctx.lineTo(x2a, y2);
  ctx.closePath();
}
function lighten(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) + 42);
  const g = Math.min(255, ((n >> 8) & 255) + 42);
  const b = Math.min(255, (n & 255) + 42);
  return "rgb(" + r + "," + g + "," + b + ")";
}
function drawCar(cx, cy, len, tilt, pal, brake) {
  const w = len * 0.7, h = len * 0.5;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);
  // 地面阴影
  ctx.fillStyle = "rgba(0,0,0,0.32)";
  ctx.beginPath(); ctx.ellipse(0, h * 0.44, w * 0.6, h * 0.12, 0, 0, Math.PI * 2); ctx.fill();
  // 后轮 + 轮毂
  const wr = w * 0.15, wy = h * 0.4;
  ctx.fillStyle = "#0c0e14";
  ctx.beginPath(); ctx.arc(-w * 0.42, wy, wr, 0, Math.PI * 2); ctx.arc(w * 0.42, wy, wr, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = Math.max(1, wr * 0.12);
  ctx.beginPath(); ctx.arc(-w * 0.42, wy, wr * 0.8, Math.PI * 0.9, Math.PI * 1.6); ctx.stroke();
  ctx.beginPath(); ctx.arc(w * 0.42, wy, wr * 0.8, Math.PI * 0.9, Math.PI * 1.6); ctx.stroke();
  ctx.fillStyle = "#c2cad9";
  ctx.beginPath(); ctx.arc(-w * 0.42, wy, wr * 0.4, 0, Math.PI * 2); ctx.arc(w * 0.42, wy, wr * 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#6a7284";
  ctx.beginPath(); ctx.arc(-w * 0.42, wy, wr * 0.13, 0, Math.PI * 2); ctx.arc(w * 0.42, wy, wr * 0.13, 0, Math.PI * 2); ctx.fill();
  // 车尾板（宽扁圆角矩形）
  const bodyTop = -h * 0.12, bodyBot = h * 0.4;
  ctx.fillStyle = pal[0];
  rr(-w * 0.45, bodyTop, w * 0.9, bodyBot - bodyTop, w * 0.06); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  rr(-w * 0.45, bodyTop, w * 0.1, bodyBot - bodyTop, w * 0.05); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  rr(w * 0.32, bodyTop, w * 0.13, bodyBot - bodyTop, w * 0.05); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(-w * 0.4, h * 0.22, w * 0.8, h * 0.018);
  // 车顶（窄圆角矩形，亮色）
  ctx.fillStyle = lighten(pal[0]);
  rr(-w * 0.19, -h * 0.52, w * 0.38, h * 0.4, w * 0.1); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.fillRect(-w * 0.19, bodyTop - h * 0.03, w * 0.38, h * 0.035);
  // 后窗（梯形玻璃）
  ctx.fillStyle = pal[1];
  ctx.beginPath();
  ctx.moveTo(-w * 0.13, -h * 0.4); ctx.lineTo(w * 0.13, -h * 0.4);
  ctx.lineTo(w * 0.17, -h * 0.16); ctx.lineTo(-w * 0.17, -h * 0.16);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.22)";
  ctx.beginPath();
  ctx.moveTo(-w * 0.1, -h * 0.37); ctx.lineTo(-w * 0.03, -h * 0.37);
  ctx.lineTo(-w * 0.07, -h * 0.2); ctx.lineTo(-w * 0.12, -h * 0.2);
  ctx.closePath(); ctx.fill();
  // 尾翼
  ctx.fillStyle = pal[2];
  rr(-w * 0.4, -h * 0.26, w * 0.8, h * 0.085, w * 0.04); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  rr(-w * 0.4, -h * 0.25, w * 0.8, h * 0.024, w * 0.035); ctx.fill();
  // 双竖尾灯（左右各一）
  const lampW = w * 0.11, lampH = h * 0.16, lampY = -h * 0.02;
  ctx.fillStyle = brake ? "rgba(255,34,51,0.5)" : "rgba(255,90,78,0.34)";
  rr(-w * 0.36, lampY, lampW + w * 0.03, lampH + h * 0.05, w * 0.05); ctx.fill();
  rr(w * 0.36 - lampW - w * 0.03, lampY, lampW + w * 0.03, lampH + h * 0.05, w * 0.05); ctx.fill();
  ctx.fillStyle = brake ? "#ff2233" : "#ff5a4e";
  rr(-w * 0.35, lampY + h * 0.01, lampW, lampH, w * 0.045); ctx.fill();
  rr(w * 0.35 - lampW, lampY + h * 0.01, lampW, lampH, w * 0.045); ctx.fill();
  ctx.fillStyle = brake ? "#ffc4ca" : "#ffc0b8";
  rr(-w * 0.33, lampY + h * 0.02, lampW * 0.5, lampH * 0.3, w * 0.03); ctx.fill();
  rr(w * 0.35 - lampW + lampW * 0.1, lampY + h * 0.02, lampW * 0.5, lampH * 0.3, w * 0.03); ctx.fill();
  // 牌照
  ctx.fillStyle = "#e8ecf2";
  rr(-w * 0.11, h * 0.18, w * 0.22, h * 0.11, w * 0.03); ctx.fill();
  ctx.fillStyle = "#3a4150";
  ctx.fillRect(-w * 0.09, h * 0.22, w * 0.18, h * 0.04);
  // 后保险杠
  ctx.fillStyle = "#23262f";
  rr(-w * 0.4, h * 0.32, w * 0.8, h * 0.09, w * 0.035); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  rr(-w * 0.4, h * 0.33, w * 0.8, h * 0.02, w * 0.035); ctx.fill();
  // 排气管
  ctx.fillStyle = "#0c0e14";
  ctx.beginPath(); ctx.arc(-w * 0.22, h * 0.37, w * 0.035, 0, Math.PI * 2); ctx.arc(w * 0.22, h * 0.37, w * 0.035, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#c8ced9";
  ctx.beginPath(); ctx.arc(-w * 0.22, h * 0.37, w * 0.016, 0, Math.PI * 2); ctx.arc(w * 0.22, h * 0.37, w * 0.016, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function draw(clock) {
  const s = G;
  ctx.save();
  ctx.clearRect(0, 0, CW, CH);
  if (s.camShake > 0) ctx.translate((Math.random() - 0.5) * s.camShake * 16, (Math.random() - 0.5) * s.camShake * 16);

  // 天空
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, "#2c4a8a"); sky.addColorStop(0.62, "#5d80d2"); sky.addColorStop(1, "#a9c5ec");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, CW, HORIZON + 1);
  const sunX = CW * 0.76, sunY = HORIZON - 66;
  const glow = ctx.createRadialGradient(sunX, sunY, 6, sunX, sunY, 90);
  glow.addColorStop(0, "rgba(255,240,190,0.9)"); glow.addColorStop(0.35, "rgba(255,220,150,0.35)"); glow.addColorStop(1, "rgba(255,220,150,0)");
  ctx.fillStyle = glow; ctx.fillRect(sunX - 90, sunY - 90, 180, 180);
  ctx.fillStyle = "#fff3cf"; ctx.beginPath(); ctx.arc(sunX, sunY, 22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.72)";
  for (let i = 0; i < 3; i++) {
    const cx = ((i * 380 + clock * 14) % (CW + 260)) - 130, cy = 46 + i * 34;
    ctx.beginPath(); ctx.ellipse(cx, cy, 52, 15, 0, 0, Math.PI * 2); ctx.ellipse(cx + 30, cy - 8, 32, 12, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = "rgba(128,148,196,0.85)";
  ctx.beginPath(); ctx.moveTo(0, HORIZON + 2);
  for (let x = 0; x <= CW; x += 36) { const y = HORIZON - 26 - 40 * Math.abs(Math.sin(x * 0.008 + 1.2 + clock * 0.004)) - 26 * Math.sin(x * 0.02 + clock * 0.01); ctx.lineTo(x, y); }
  ctx.lineTo(CW, HORIZON + 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(74,126,88,0.9)";
  ctx.beginPath(); ctx.moveTo(0, HORIZON + 2);
  for (let x = 0; x <= CW; x += 30) { const y = HORIZON - 10 - 30 * Math.abs(Math.sin(x * 0.012 + 2.6 + clock * 0.006)) - 18 * Math.sin(x * 0.027); ctx.lineTo(x, y); }
  ctx.lineTo(CW, HORIZON + 2); ctx.closePath(); ctx.fill();

  // 草地
  const grass = ctx.createLinearGradient(0, HORIZON, 0, CH);
  grass.addColorStop(0, "#63ab68"); grass.addColorStop(1, "#377a40");
  ctx.fillStyle = grass; ctx.fillRect(0, HORIZON, CW, CH - HORIZON);

  // 赛道
  const playerSeg = segIndexOf(s.player.z);
  const views = computeViews(s.track, playerSeg, s.player.x);
  const aiBySeg = new Map();
  for (const c of s.ai) {
    const segIdx = segIndexOf(c.z);
    const rel = ((segIdx - playerSeg) % TRACK_SEGS + TRACK_SEGS) % TRACK_SEGS;
    if (rel >= 1 && rel <= DRAW_DIST) {
      const arr = aiBySeg.get(segIdx) || []; arr.push(c); aiBySeg.set(segIdx, arr);
    }
  }
  const sprites = [];
  for (let i = views.length - 1; i >= 0; i--) {
    const v = views[i], near = i > 0 ? views[i - 1] : null;
    const half = ROAD_W / 2;
    const topY = v.y, topL = v.centerX - half * v.scale, topR = v.centerX + half * v.scale;
    const botY = near ? near.y : CH;
    const botL = near ? near.centerX - half * near.scale : topL;
    const botR = near ? near.centerX + half * near.scale : topR;
    const ns = near ? near.scale : v.scale;
    ctx.fillStyle = v.seg.index % 2 === 0 ? "#6b7284" : "#565c6c";
    trap(topL, topR, topY, botL, botR, botY); ctx.fill();
    const curb = ROAD_W * 0.055;
    const redCurb = v.seg.index % 12 < 6;
    ctx.fillStyle = redCurb ? "#e04b3e" : "#e9e6dc";
    trap(topL - curb * v.scale, topL, topY, botL - curb * ns, botL, botY); ctx.fill();
    ctx.fillStyle = redCurb ? "#e9e6dc" : "#e04b3e";
    trap(topR, topR + curb * v.scale, topY, botR, botR + curb * ns, botY); ctx.fill();
    const midW = ROAD_W * 0.014;
    ctx.fillStyle = v.seg.index % 2 === 0 ? "rgba(255,255,255,0.72)" : "rgba(255,255,255,0.34)";
    trap(v.centerX - (midW / 2) * v.scale, v.centerX + (midW / 2) * v.scale, topY,
         near ? near.centerX - (midW / 2) * ns : v.centerX - (midW / 2) * v.scale,
         near ? near.centerX + (midW / 2) * ns : v.centerX + (midW / 2) * v.scale, botY); ctx.fill();

    if (v.dz > 46) {
      const dec = roadsideAt(v.seg.index);
      if (dec) {
        const sx = v.centerX + dec.x * dec.side * v.scale, sy = v.y, depth = v.dz;
        sprites.push({ depth, draw: () => {
          if (dec.kind === "tree") {
            const crown = v.scale * 7;
            ctx.fillStyle = "#7a5a36"; ctx.fillRect(sx - crown * 0.05, sy, crown * 0.1, crown * 0.45);
            ctx.fillStyle = "#3f8a4c";
            ctx.beginPath(); ctx.arc(sx, sy - crown * 0.2, crown * 0.5, 0, Math.PI * 2);
            ctx.arc(sx - crown * 0.34, sy - crown * 0.05, crown * 0.34, 0, Math.PI * 2);
            ctx.arc(sx + crown * 0.34, sy - crown * 0.05, crown * 0.34, 0, Math.PI * 2); ctx.fill();
          } else {
            const h = v.scale * 5.5;
            ctx.fillStyle = "#8f97a8"; ctx.fillRect(sx - v.scale * 0.16, sy - h, v.scale * 0.32, h);
            ctx.fillStyle = "#ffe9a8"; ctx.beginPath(); ctx.arc(sx, sy - h, v.scale * 0.55, 0, Math.PI * 2); ctx.fill();
          }
        }});
      }
    }
    const cars = aiBySeg.get(v.seg.index) || [];
    for (const c of cars) {
      const sx = v.centerX + c.x * half * v.scale;
      const lenPx = Math.max(8, CAR_LEN * v.scale);
      const pal = CAR_COLORS[c.colorIdx] || CAR_COLORS[0];
      const carY = v.y + lenPx * 0.5, depth = v.dz;
      sprites.push({ depth, draw: () => drawCar(sx, carY, lenPx, 0, pal, false) });
    }
  }
  sprites.sort((a, b) => b.depth - a.depth);
  for (const sp of sprites) sp.draw();
  ctx.restore();

  // 玩家车
  const px = CW / 2 + s.player.x * 250, py = CH - 78;
  if (Math.abs(s.player.speed) > 14) {
    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
    const n = 2 + Math.floor(Math.abs(s.player.speed) / 16);
    for (let i = 0; i < n; i++) {
      const ox = (i % 2 === 0 ? -1 : 1) * (66 + (i % 3) * 16);
      const sy = py + 60 + (i % 2) * 10, drag = 30 + Math.abs(s.player.speed) * 1.3;
      ctx.beginPath(); ctx.moveTo(px + ox, sy); ctx.lineTo(px + ox, sy + drag); ctx.stroke();
    }
  }
  drawCar(px, py, 128, s.player.steer * 0.16, ["#ff5a4e", "#2b2f3e", "#c33d33"], keys.has("ArrowDown") || keys.has("s") || keys.has("S"));

  // HUD
  ctx.fillStyle = "rgba(10,12,20,0.62)";
  rr(14, CH - 92, 168, 78, 16); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.font = "700 38px system-ui, sans-serif"; ctx.textAlign = "left";
  ctx.fillText(String(kmh(s.player.speed)), 30, CH - 42);
  ctx.font = "600 13px system-ui, sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.62)";
  ctx.fillText("km/h", 118, CH - 42);
  ctx.fillStyle = "rgba(10,12,20,0.62)";
  rr(CW - 236, 14, 222, 78, 16); ctx.fill();
  ctx.textAlign = "right";
  ctx.font = "700 22px system-ui, sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.95)";
  ctx.fillText(s.lap + " / " + TOTAL_LAPS, CW - 28, 42);
  ctx.font = "600 30px system-ui, sans-serif";
  ctx.fillText(fmt(s.time), CW - 28, 76);
  ctx.font = "600 11px system-ui, sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("LAP", CW - 28, 24);
  if (s.bestLap !== null) {
    ctx.font = "600 12px system-ui, sans-serif"; ctx.fillStyle = "rgba(255,224,130,0.95)";
    ctx.fillText("BEST " + fmt(s.bestLap), CW - 28, 100);
  }
  if (s.lapFlash > 0) {
    const a = Math.min(1, s.lapFlash / 0.6);
    ctx.textAlign = "center"; ctx.font = "800 44px system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,224,130," + a + ")";
    ctx.fillText("第 " + (s.lap - 1) + " 圈完成", CW / 2, CH * 0.34);
  }
}

/* ============ 主循环 ============ */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const s = G;
  if (phase === "running" && !s.over) {
    stepPlayer(s.player, {
      up: keys.has("ArrowUp") || keys.has("w") || keys.has("W"),
      down: keys.has("ArrowDown") || keys.has("s") || keys.has("S"),
      left: keys.has("ArrowLeft") || keys.has("a") || keys.has("A"),
      right: keys.has("ArrowRight") || keys.has("d") || keys.has("D"),
    }, s.track.segs[segIndexOf(s.player.z)].curve, dt);
    s.player.z = ((s.player.z + s.player.speed * dt) % TRACK_METERS + TRACK_METERS) % TRACK_METERS;
    s.time += dt;
    const crossed = s.prevZ > TRACK_METERS * 0.75 && s.player.z < TRACK_METERS * 0.25;
    s.prevZ = s.player.z;
    if (crossed) {
      const lapSec = s.time - s.lapStart;
      if (s.bestLap === null || lapSec < s.bestLap) s.bestLap = lapSec;
      s.lap += 1; s.lapStart = s.time; s.lapFlash = 2.2;
      if (s.lap > TOTAL_LAPS) { s.over = true; }
    }
    for (const c of s.ai) stepAi(c, s.track.rand, dt);
    for (const c of s.ai) respawnFarAi(c, s.track.rand, s.player.z);
    for (const c of s.ai) {
      if (detectCollision(s.player, c)) { s.player.speed *= 0.45; s.player.crash = 0.35; s.camShake = 0.4; }
    }
    if (s.lapFlash > 0) s.lapFlash -= dt;
    if (s.camShake > 0) s.camShake -= dt;
  }
  draw(now / 1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener("keydown", (e) => {
  const k = e.key;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(k) >= 0) e.preventDefault();
  keys.add(k);
  if (k === "p" || k === "P") phase = phase === "running" ? "paused" : "running";
  if (k === "r" || k === "R") G = newGame();
});
window.addEventListener("keyup", (e) => keys.delete(e.key));
cv.addEventListener("click", () => { if (phase === "paused") phase = "running"; });

/* 调试 hook：便于外部脚本注入状态做视觉验证 */
window.G = G;
window.TRACK_METERS = TRACK_METERS;

/* 演示模式：?demo=1 时自动进入「全速 + 左弯 + 前方 AI 车」状态（仅验证用） */
if (new URLSearchParams(location.search).get("demo") === "1") {
  cv.style.width = "100%";
  cv.style.maxWidth = "none";
  const q = new URLSearchParams(location.search);
  if (q.get("steer") === "right") keys.add("ArrowRight");
  else if (q.get("steer") === "left") keys.add("ArrowLeft");
  setTimeout(() => {
    G.player.speed = 62;
    G.player.z = 260;
    G.player.x = 0.3;
    G.ai[0].z = (G.player.z + 60) % TRACK_METERS;
    G.ai[0].x = 0;
    G.ai[0].speed = 45;
  }, 300);
  const dbg = document.createElement("pre");
  dbg.id = "dbg";
  dbg.style.cssText = "color:#fff;font-size:13px;position:fixed;left:8px;top:8px;background:rgba(0,0,0,.7);padding:6px 10px;border-radius:8px;z-index:99;white-space:pre;";
  document.body.appendChild(dbg);
  setInterval(() => {
    dbg.textContent = "z=" + Math.round(G.player.z) + " spd=" + Math.round(G.player.speed * 10) / 10 + " x=" + G.player.x.toFixed(2) + " st=" + G.player.steer + " lap=" + G.lap + " ai0z=" + Math.round(G.ai[0].z) + " phase=" + phase;
  }, 200);
}
</script>
